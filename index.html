<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Financial Simulator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <dialog id="blockEditor" class="editor-dialog" aria-labelledby="blockEditorTitle">
      <div class="editor-shell">
        <header class="editor-header">
          <h2 id="blockEditorTitle">Cash flow</h2>
          <button id="closeBlockEditor" class="icon-button secondary" type="button" aria-label="Close editor">×</button>
        </header>
        <div class="editor-layout">
          <aside class="editor-sidebar">
            <div class="editor-sidebar-title">
              <span>Entries</span>
              <span id="editorBlockCount" class="count-pill"></span>
            </div>
            <nav id="editorBlockList" class="editor-block-list" aria-label="Income and expenses"></nav>
            <div class="editor-add-actions">
              <button id="editorAddIncome" type="button">+ Income</button>
              <button id="editorAddExpense" class="secondary" type="button">+ Expense</button>
            </div>
          </aside>
          <section id="editorDetail" class="editor-detail"></section>
        </div>
      </div>
    </dialog>

    <div class="app-shell">
      <aside class="app-nav">
        <div class="brand"><span class="brand-symbol" aria-hidden="true">F</span><h1>Financial Simulator</h1></div>
        <nav aria-label="Sections">
          <a href="#scenarios">Plan</a>
          <a href="#forecast">Reports</a>
        </nav>
        <div class="nav-section-title"><span>Accounts</span></div>
        <div id="navAccounts" class="nav-accounts"></div>
        <div class="nav-footer">Local workspace</div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-title">Plan</div>
          <div class="controls">
            <label>Current age <input id="currentAge" type="number" value="35" min="0" max="120"/></label>
            <label>Retirement age <input id="retireAge" type="number" value="65" min="0" max="120"/></label>
            <label>City <select id="citySelect"></select></label>
            <label>Particles <input id="numParticles" type="number" value="300" min="20" max="2000" step="20"/></label>
            <label class="inline"><input id="useParticleFilter" type="checkbox" checked/> Resampling</label>
            <button id="runSim" class="primary">Run simulation</button>
          </div>
          <div id="summaryStats" class="summary"></div>
        </header>

        <main>
      <section class="left">
        <details id="scenarios" open>
          <summary><h2>Scenarios</h2></summary>
          <div class="row">
            <label>Scenario name <input id="scenarioName" type="text" placeholder="Base case"/></label>
          </div>
          <div class="row">
            <label>Notes <textarea id="scenarioNotes" rows="3"></textarea></label>
          </div>
          <div class="row">
            <button id="saveScenario">Save</button>
            <button id="exportScenario" class="secondary" type="button">Export JSON</button>
            <select id="scenarioSelect"></select>
            <button id="loadScenario">Load</button>
            <button id="deleteScenario" class="remove">Delete</button>
          </div>
          <div class="row">
            <button id="resetToBase" class="secondary" type="button">Reset to base scenario</button>
          </div>
          <div id="scenarioStatus" class="small"></div>
        </details>

        <details id="accounts" open>
          <summary><h2>Accounts</h2></summary>
          <div id="accounts"></div>
          <button id="addAccount">+ Add Account</button>
        </details>

        <details id="cash-flow" open>
          <summary><h2>Income &amp; Expenses</h2></summary>
          <div id="blocks"></div>
          <div class="block-actions">
            <button id="addIncome">+ Add Income</button>
            <button id="addExpense">+ Add Expense</button>
            <button id="addLoan" class="secondary" type="button">+ Add Financed Purchase (Loan)</button>
          </div>
        </details>

        <details>
          <summary><h2>Global Returns Schedule</h2></summary>
          <div id="returnsSegments"></div>
          <button id="addReturnSegment">+ Add Segment</button>
          <div class="row">
            <label>Default annual % <input id="defaultAnnual" type="number" step="0.1" value="6"/></label>
            <label>Default σ % <input id="defaultSigma" type="number" step="0.1" value="9"/></label>
          </div>
        </details>

        <details>
          <summary><h2>House Affordability</h2></summary>
          <div class="row"><label>Gross monthly income <input id="affIncome" type="number" value="10000"/></label></div>
          <div class="row"><label>Existing monthly debt <input id="affDebt" type="number" value="0"/></label></div>
          <div class="row"><label>Down payment $ <input id="affDown" type="number" value="60000"/></label></div>
          <div class="row"><label>Mortgage rate % <input id="affRate" type="number" step="0.1" value="6.5"/></label></div>
          <div class="row"><label>Term (years) <input id="affTerm" type="number" value="30"/></label></div>
          <div class="row"><label>Property tax % / yr <input id="affTax" type="number" step="0.1" value="1.1"/></label></div>
          <div class="row"><label>Insurance $ / yr <input id="affIns" type="number" value="1800"/></label></div>
          <div class="row"><label>HOA $ / month <input id="affHOA" type="number" value="0"/></label></div>
          <button id="computeAfford">Compute Max Home Price</button>
          <div id="affordResult" class="result"></div>
        </details>
      </section>

      <section id="forecast" class="right" aria-label="Simulation results">
        <div class="results-heading">
          <h2>Forecast</h2>
        </div>
        <article id="balanceChartCard" class="chart-card">
          <div class="chart-heading">
            <h3>Net worth range</h3>
            <div class="chart-actions">
              <label class="chart-control">Axes
                <select id="balanceScale">
                  <option value="linear">Linear</option>
                  <option value="log-y">Log Y</option>
                  <option value="log-x">Log X</option>
                  <option value="log-xy">Log X + Y</option>
                </select>
              </label>
              <button class="secondary chart-fullscreen" data-fullscreen="balanceChartCard" type="button">Full screen</button>
            </div>
          </div>
          <details class="axis-settings">
            <summary>View &amp; zoom</summary>
            <div class="axis-settings-grid">
              <label>X from <input id="balanceXMin" type="month"/></label>
              <label>X to <input id="balanceXMax" type="month"/></label>
              <label>Y minimum <input id="balanceYMin" type="number" placeholder="Auto"/></label>
              <label>Y maximum <input id="balanceYMax" type="number" placeholder="Auto"/></label>
              <div class="axis-buttons">
                <button id="balanceApplyView" type="button">Apply</button>
                <button id="balanceZoomIn" class="secondary" type="button">Zoom in</button>
                <button id="balanceZoomOut" class="secondary" type="button">Zoom out</button>
                <button id="balanceResetView" class="secondary" type="button">Reset</button>
              </div>
            </div>
          </details>
          <div class="chart-frame chart-frame--large">
            <canvas id="balanceChart"></canvas>
          </div>
        </article>
        <article id="compositionChartCard" class="chart-card">
          <div class="chart-heading">
            <h3>Account mix</h3>
            <div class="chart-actions">
              <label class="chart-control">Axes
                <select id="compositionScale">
                  <option value="linear">Linear</option>
                  <option value="log-y">Log Y</option>
                  <option value="log-x">Log X</option>
                  <option value="log-xy">Log X + Y</option>
                </select>
              </label>
              <details class="account-filter">
                <summary>Filter accounts</summary>
                <div id="accountFilterMenu" class="account-filter-menu">
                  <span class="small">Run the simulation to choose accounts.</span>
                </div>
              </details>
              <button class="secondary chart-fullscreen" data-fullscreen="compositionChartCard" type="button">Full screen</button>
            </div>
          </div>
          <details class="axis-settings">
            <summary>View &amp; zoom</summary>
            <div class="axis-settings-grid">
              <label>X from <input id="compositionXMin" type="month"/></label>
              <label>X to <input id="compositionXMax" type="month"/></label>
              <label>Y minimum <input id="compositionYMin" type="number" placeholder="Auto"/></label>
              <label>Y maximum <input id="compositionYMax" type="number" placeholder="Auto"/></label>
              <div class="axis-buttons">
                <button id="compositionApplyView" type="button">Apply</button>
                <button id="compositionZoomIn" class="secondary" type="button">Zoom in</button>
                <button id="compositionZoomOut" class="secondary" type="button">Zoom out</button>
                <button id="compositionResetView" class="secondary" type="button">Reset</button>
              </div>
            </div>
          </details>
          <div class="chart-frame chart-frame--small">
            <canvas id="compositionChart"></canvas>
          </div>
        </article>
      </section>
        </main>
      </div>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
