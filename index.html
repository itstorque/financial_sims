<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Financial Simulator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-nav">
        <div class="brand"><span class="brand-symbol" aria-hidden="true">F</span><h1>Financial Simulator</h1></div>
        <nav aria-label="Sections">
          <a href="#scenarios">Plan</a>
          <a href="#forecast">Reports</a>
        </nav>
        <div class="nav-section-title"><span>Accounts</span></div>
        <div id="navAccounts" class="nav-accounts"></div>
        <div class="nav-footer">Local workspace</div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-title">Plan</div>
          <div class="controls">
            <label>Current age <input id="currentAge" type="number" value="35" min="0" max="120"/></label>
            <label>Retirement age <input id="retireAge" type="number" value="65" min="0" max="120"/></label>
            <label>City <select id="citySelect"></select></label>
            <label>Particles <input id="numParticles" type="number" value="300" min="20" max="2000" step="20"/></label>
            <label class="inline"><input id="useParticleFilter" type="checkbox" checked/> Resampling</label>
            <button id="runSim" class="primary">Run simulation</button>
          </div>
          <div id="summaryStats" class="summary"></div>
        </header>

        <main>
      <section class="left">
        <details id="scenarios" open>
          <summary><h2>Scenarios</h2></summary>
          <div class="row">
            <label>Scenario name <input id="scenarioName" type="text" placeholder="Base case"/></label>
          </div>
          <div class="row">
            <label>Notes <textarea id="scenarioNotes" rows="3"></textarea></label>
          </div>
          <div class="row">
            <button id="saveScenario">Save</button>
            <button id="exportScenario" class="secondary" type="button">Export JSON</button>
            <select id="scenarioSelect"></select>
            <button id="loadScenario">Load</button>
            <button id="deleteScenario" class="remove">Delete</button>
          </div>
          <div id="scenarioStatus" class="small"></div>
        </details>

        <details id="accounts" open>
          <summary><h2>Accounts</h2></summary>
          <div id="accounts"></div>
          <button id="addAccount">+ Add Account</button>
        </details>

        <details id="cash-flow" open>
          <summary><h2>Income &amp; Expenses</h2></summary>
          <div id="blocks"></div>
          <div class="block-actions">
            <button id="addIncome">+ Add Income</button>
            <button id="addExpense">+ Add Expense</button>
            <button id="addLoan" class="secondary" type="button">+ Add Financed Purchase (Loan)</button>
          </div>
        </details>

        <details>
          <summary><h2>Global Returns Schedule</h2></summary>
          <div id="returnsSegments"></div>
          <button id="addReturnSegment">+ Add Segment</button>
          <div class="row">
            <label>Default annual % <input id="defaultAnnual" type="number" step="0.1" value="6"/></label>
            <label>Default σ % <input id="defaultSigma" type="number" step="0.1" value="9"/></label>
          </div>
        </details>

        <details>
          <summary><h2>House Affordability</h2></summary>
          <div class="row"><label>Gross monthly income <input id="affIncome" type="number" value="10000"/></label></div>
          <div class="row"><label>Existing monthly debt <input id="affDebt" type="number" value="0"/></label></div>
          <div class="row"><label>Down payment $ <input id="affDown" type="number" value="60000"/></label></div>
          <div class="row"><label>Mortgage rate % <input id="affRate" type="number" step="0.1" value="6.5"/></label></div>
          <div class="row"><label>Term (years) <input id="affTerm" type="number" value="30"/></label></div>
          <div class="row"><label>Property tax % / yr <input id="affTax" type="number" step="0.1" value="1.1"/></label></div>
          <div class="row"><label>Insurance $ / yr <input id="affIns" type="number" value="1800"/></label></div>
          <div class="row"><label>HOA $ / month <input id="affHOA" type="number" value="0"/></label></div>
          <button id="computeAfford">Compute Max Home Price</button>
          <div id="affordResult" class="result"></div>
        </details>
      </section>

      <section id="forecast" class="right" aria-label="Simulation results">
        <div class="results-heading">
          <h2>Forecast</h2>
        </div>
        <article class="chart-card">
          <div class="chart-heading">
            <h3>Net worth range</h3>
          </div>
          <div class="chart-frame chart-frame--large">
            <canvas id="balanceChart"></canvas>
          </div>
        </article>
        <article class="chart-card">
          <div class="chart-heading">
            <h3>Account mix</h3>
          </div>
          <div class="chart-frame chart-frame--small">
            <canvas id="compositionChart"></canvas>
          </div>
        </article>
      </section>
        </main>
      </div>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
